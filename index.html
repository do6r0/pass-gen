<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="password-box">
            <span id="current-password">Press Generate</span>
        </div>

        <div class="controls">
            <button id="btn-generate" class="btn primary">Generate</button>
            <button id="btn-copy" class="btn secondary">Copy</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>History (passwords.txt)</h2>
                <div class="history-actions">
                    <button id="btn-download" class="btn small">Download .txt</button>
                    <button id="btn-clear" class="btn small danger">Clear</button>
                </div>
            </div>
            <textarea id="history-log" readonly placeholder="No passwords generated yet..."></textarea>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
