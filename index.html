<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        
        <div class="password-display" id="passwordDisplay">Press Generate</div>
        
        <div class="controls">
            <button id="generateBtn" class="btn primary">Generate</button>
            <button id="copyBtn" class="btn secondary">Copy</button>
        </div>

        <div class="history-section">
            <div class="history-header">
                <h2>Saved Passwords (passwords.txt)</h2>
                <div class="history-actions">
                    <button id="downloadBtn" class="btn small">Download .txt</button>
                    <button id="clearBtn" class="btn small danger">Clear</button>
                </div>
            </div>
            <textarea id="historyBox" readonly placeholder="No passwords generated yet..."></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
